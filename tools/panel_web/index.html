<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Контент-завод</title>
<style>
:root{--ink:#2b2622;--dim:#8c8276;--wall:#fffdfa;--line:#e2d9cb;
  --work:#2f9e6e;--queue:#d79b2a;--bad:#c6453c}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{color:var(--ink);background:#efe8dc;overflow:hidden;
  font:13.5px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
#stage{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%}
#over{position:fixed;inset:0;pointer-events:none}

.hud{position:fixed;left:18px;top:16px;max-width:min(420px,calc(100vw - 36px));
  background:rgba(255,253,250,.92);backdrop-filter:blur(8px);
  border:1px solid var(--line);border-radius:14px;padding:12px 15px}
.hud h1{font-size:15px;margin:0;font-weight:680;letter-spacing:-.01em}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--work);
  margin-right:7px;vertical-align:1px;animation:beat 2.4s ease-in-out infinite}
.dot.off{background:var(--bad);animation:none}
@keyframes beat{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(47,158,110,.45)}
  50%{opacity:.6;box-shadow:0 0 0 7px rgba(47,158,110,0)}}
.sub{color:var(--dim);font-size:12px;margin-top:3px}
.nums{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px}
.stat .num{font-size:19px;font-weight:680;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .lbl{font-size:10.5px;color:var(--dim)}

/* табличка над головой: имя, должность, чем занят */
.tag{position:absolute;transform:translate(-50%,-100%);white-space:nowrap;
  background:rgba(255,253,250,.95);border:1px solid var(--line);border-radius:10px;
  padding:4px 8px;box-shadow:0 6px 18px -12px rgba(43,38,34,.6);
  transition:opacity .3s}
.tag .nm{font-weight:650;font-size:12px}
.tag .rl{font-size:10.5px;color:var(--dim)}
.tag .do{font-size:11px;margin-top:2px;max-width:220px;overflow:hidden;
  text-overflow:ellipsis}
.tag.work{border-color:#bfe6d2}
.tag.work .do{color:var(--work)}
.tag.queue{border-color:#f0dcae}
.tag.queue .do{color:var(--queue)}
.tag.idle{opacity:.6;padding:3px 7px}
.tag.idle .do{color:var(--dim)}
.tag .tm{font-variant-numeric:tabular-nums;color:var(--dim);font-size:10.5px}
.dots i{display:inline-block;width:3px;height:3px;margin-left:2px;border-radius:50%;
  background:var(--work);animation:blink 1.2s infinite}
.dots i:nth-child(2){animation-delay:.2s}
.dots i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}

.panelbox{position:fixed;right:18px;top:16px;bottom:16px;width:310px;overflow:auto;
  background:rgba(255,253,250,.92);backdrop-filter:blur(8px);
  border:1px solid var(--line);border-radius:14px;padding:13px 15px;
  pointer-events:auto}
.panelbox h2{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;
  color:var(--dim);margin:0 0 9px;font-weight:650}
.panelbox h2.gap{margin-top:16px}
table{width:100%;border-collapse:collapse;font-size:12px;table-layout:fixed}
td{padding:5px 0;border-bottom:1px solid #efe8dc;vertical-align:top}
tr:last-child td{border-bottom:0}
td:first-child{overflow:hidden}
.ttl{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
td.r{text-align:right;color:var(--dim);font-variant-numeric:tabular-nums;
  white-space:nowrap;width:70px;padding-left:8px}
.pill{font-size:10px;padding:1px 6px;border-radius:999px;border:1px solid}
.s-done{color:var(--work);border-color:#bfe6d2;background:#f0faf5}
.s-failed,.s-timeout{color:var(--bad);border-color:#f0c9c5;background:#fdf2f1}
.s-running{color:#2d6fb0;border-color:#c4dcf2;background:#f0f6fc}
.err{color:var(--bad);font-size:11px;white-space:normal;line-height:1.35}
.line{font-size:12px;padding:5px 0;border-bottom:1px solid #efe8dc}
.line:last-child{border-bottom:0}
.line span{color:var(--dim)}
.empty{color:var(--dim);font-size:12px}

.hint{position:fixed;left:18px;bottom:14px;color:var(--dim);font-size:11.5px;
  background:rgba(255,253,250,.8);border-radius:8px;padding:4px 9px}
.oops{position:fixed;inset:auto 0 0 0;padding:14px 18px;background:#fdf2f1;
  color:var(--bad);font-size:12.5px;display:none}
@media (max-width:860px){.panelbox{display:none}}
</style></head><body>
<div id="stage"></div>
<div id="over"></div>
<div class="hud">
  <h1><span class="dot" id="pulse"></span>Контент-завод</h1>
  <div class="sub" id="head">соединяюсь…</div>
  <div class="nums" id="nums"></div>
</div>
<div class="panelbox">
  <h2>Последние прогоны</h2><table id="runs"></table>
  <h2 class="gap">Бренды</h2><div id="tenants"></div>
  <h2 class="gap">Ждут отправки</h2><table id="due"></table>
</div>
<div class="hint">мышью — повернуть офис, колесом — ближе</div>
<div class="oops" id="oops"></div>
<script type="module" src="/office.js"></script>
</body></html>
