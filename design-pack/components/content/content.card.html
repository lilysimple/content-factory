<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; background: var(--bg-page); font-family: var(--font-body); }
  #root { padding: 30px; display: flex; flex-direction: column; gap: 22px; }
  .lbl { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent-2); margin-bottom: 12px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; align-items: start; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { RubricPill, Eyebrow, StatCard, QuoteCard, NumberedList, BeforeAfter } =
    window.LilySpaceDesignSystem_e0f3bd;

  function Demo() {
    return (
      <>
        <div>
          <div className="lbl">Рубрики · RubricPill</div>
          <div className="row">
            <RubricPill tone="dark">ИИ для бизнеса</RubricPill>
            <RubricPill tone="outline">Автоматизация</RubricPill>
            <RubricPill tone="sage">Промпты</RubricPill>
            <RubricPill tone="terracotta">Разбор профессий</RubricPill>
          </div>
        </div>

        <div>
          <div className="lbl">Eyebrow</div>
          <div className="row" style={{ gap: '28px' }}>
            <Eyebrow number="02">Цвет</Eyebrow>
            <Eyebrow color="var(--accent-2)">Позиционирование</Eyebrow>
          </div>
        </div>

        <div className="grid">
          <StatCard
            eyebrow="Метрика"
            value="−40%"
            label="времени на рутинные задачи после внедрения AI-ассистента"
            progress={60}
            from="было: 40 ч"
            to="стало: 24 ч"
          />
          <QuoteCard
            eyebrow="Промпт"
            author="Лили · шаблон"
            avatar="../../assets/images/author.jpg"
          >
            «Выступи как аналитик McKinsey и разложи задачу на 3 сценария.»
          </QuoteCard>
          <NumberedList
            eyebrow="Шаги"
            items={[
              { title: 'Определите узкое место', note: 'Где рутина съедает время' },
              { title: 'Выберите один процесс', note: 'Не всё сразу' },
              { title: 'Замерьте результат', note: 'Часы и деньги' },
            ]}
          />
        </div>

        <div>
          <div className="lbl">До / после · BeforeAfter</div>
          <div style={{ maxWidth: '420px' }}>
            <BeforeAfter
              beforeValue={<>Ручной отчёт<br/>4 часа</>}
              afterValue={<>Авто-отчёт<br/>15 минут</>}
            />
          </div>
        </div>
      </>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
