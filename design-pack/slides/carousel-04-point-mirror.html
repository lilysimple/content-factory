<!-- @dsCard group="Slides" viewport="1080x1350" name="Carousel · Point mirrored" subtitle="Arc panel right, photo left — card 5 of 6"
     Зеркало `carousel-03-point`: панель справа, фото слева. Ставится
     на последний из трёх пунктов, чтобы середина карусели не читалась
     одним длинным экраном.

     Зеркалится только сторона. Дуга та же (вертикальные радиусы сложены
     в высоту карточки), отступы те же, порядок блоков тот же: заголовок,
     линейка, текст. Разъехавшиеся половины пары видно сразу — карточки
     идут подряд. -->
<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../design/tokens.css"><style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:var(--font-body);}
  .slide{width:1080px;height:1350px;position:relative;overflow:hidden;
         background:var(--milk);}
  img{display:block;}
  .panel{position:absolute;right:0;top:0;bottom:0;width:57%;
         background:var(--milk);
         border-radius:220px 0 0 220px/675px 0 0 675px;
         padding:150px 84px 120px 96px;}
  .head{font-family:var(--font-display);font-weight:800;font-size:76px;
        line-height:1.08;letter-spacing:-0.03em;color:var(--text-primary);}
  .ac{color:var(--text-accent);}
  .rule{width:132px;height:5px;border-radius:3px;margin:40px 0 0;
        background:var(--accent-hover);}
  .body{font-size:36px;line-height:1.5;color:var(--text-secondary);
        margin-top:34px;}
  .body + .body{margin-top:32px;}
  .num{color:var(--text-accent);font-weight:600;}
  .hl{background:var(--accent-tint);border-radius:12px;padding:2px 12px;
      box-decoration-break:clone;-webkit-box-decoration-break:clone;}
</style></head><body>
<div class="slide">
  <img src="../design/assets/images/img-0934.jpg"
       style="position:absolute;inset:0;width:100%;height:100%;
              object-fit:cover;object-position:24% 42%;">
  <div class="panel">
    <div class="head">И правки<br>идут туда же,<br>а не <span class="ac">заново</span></div>
    <div class="rule"></div>
    <div class="body">Текст возвращается той же роли с пометкой,
      что поправить, — она правит свой черновик.</div>
    <div class="body">Новый круг с начала стоит
      <span class="hl">дороже правки</span> и звучит уже не так.</div>
  </div>
</div></body></html>
