<!-- @dsCard group="Slides" viewport="1080x1350" name="Carousel · Point mirrored" subtitle="Photo left, panel right — card 5 of 6"
     Зеркало `carousel-03-point`: фото слева, панель справа. Ставится
     на последний из трёх пунктов, чтобы середина карусели не читалась
     одним длинным экраном. Содержимое и типографика те же — меняется
     только сторона.

     Номер идёт в `--text-accent`: неон на тёплом белом не читается. -->
<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../design/tokens.css"><style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:var(--font-body);}
  .slide{width:1080px;height:1350px;position:relative;overflow:hidden;
         background:var(--graphite);}
  img{display:block;}
  .panel{position:absolute;right:0;top:0;bottom:0;width:66%;
         background:var(--card);border-radius:44px 0 0 44px;
         padding:84px 76px;}
  .mark{display:flex;align-items:center;gap:16px;font-size:28px;
        font-weight:500;color:var(--text-secondary);}
  .dot{width:14px;height:14px;border-radius:50%;background:var(--accent-hover);}
  .num{font-family:var(--font-display);font-weight:800;font-size:96px;
       line-height:1;letter-spacing:-0.03em;color:var(--text-accent);
       margin-top:180px;}
  .head{font-family:var(--font-display);font-weight:800;font-size:70px;
        line-height:1.12;letter-spacing:-0.025em;margin-top:24px;
        color:var(--text-primary);}
  .body{font-size:40px;line-height:1.5;color:var(--text-secondary);
        margin-top:36px;}
  .hl{background:var(--accent-tint);border-radius:10px;padding:2px 12px;
      box-decoration-break:clone;-webkit-box-decoration-break:clone;}
  .foot{position:absolute;left:76px;right:76px;bottom:72px;display:flex;
        justify-content:space-between;align-items:baseline;
        font-family:var(--font-display);font-weight:700;font-size:30px;
        letter-spacing:0.08em;text-transform:uppercase;
        color:var(--text-secondary);}
</style></head><body>
<div class="slide">
  <img src="../design/assets/images/casual1.jpg"
       style="position:absolute;left:0;top:0;width:40%;height:100%;
              object-fit:cover;object-position:50% center;">
  <div class="panel">
    <div class="mark"><span class="dot"></span>lily_.space</div>
    <div class="num">03</div>
    <div class="head">Просите ответы покороче</div>
    <div class="body">Напишите: «формируй ответы в пределах
      <span class="hl">10 предложений</span>, чтобы не перегружать
      меня». Так он выдаёт суть, и вы двигаетесь быстрее.</div>
    <div class="foot"><span>Правило третье</span><span>05 / 06</span></div>
  </div>
</div></body></html>
