<!-- @dsCard group="Slides" viewport="1080x1350" name="Carousel · Cover" subtitle="Photo hook — card 1 of 6"
     Эталон, а не шаблон: на этом пути разметку пишет модель, клонируя
     файл и меняя содержимое. Пути здесь те, по которым макет ляжет в
     `{бренд}/posts/` — оттуда до токенов и фотобанка один уровень вверх.

     Снято с живой карусели бренда (`design/assets/reference/ig/`): фото
     на каждой карточке, счётчик «01 / 06» в подвале, ударные слова в
     маркерной плашке. Затемнение графитовое — цветная вуаль красит лицо
     и спорит с акцентом. -->
<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../design/tokens.css"><style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:var(--font-body);}
  .slide{width:1080px;height:1350px;position:relative;overflow:hidden;
         background:var(--graphite);}
  img{display:block;}
  .pill{position:absolute;left:72px;top:66px;padding:20px 40px;
        border-radius:var(--radius-pill);background:var(--accent);
        font-family:var(--font-display);font-size:30px;font-weight:700;
        letter-spacing:0.08em;text-transform:uppercase;
        color:var(--accent-ink);}
  .mark{position:absolute;right:72px;top:66px;height:70px;display:flex;
        align-items:center;font-size:30px;font-weight:500;
        color:rgba(248,245,241,0.72);}
  .well{position:absolute;left:72px;right:72px;bottom:68px;}
  .head{font-family:var(--font-display);font-weight:800;font-size:96px;
        line-height:1.04;letter-spacing:-0.03em;color:var(--milk);}
  .sub{font-size:38px;line-height:1.5;color:rgba(248,245,241,0.85);
       margin-top:36px;max-width:820px;}
  /* Маркер: ударное слово в плашке акцента. Текст графитовый — белым по
     неону не читается ничего. `box-decoration-break` держит плашку
     целой, когда фраза переносится на вторую строку. */
  .hl{background:var(--accent);color:var(--accent-ink);border-radius:10px;
      padding:2px 14px;box-decoration-break:clone;
      -webkit-box-decoration-break:clone;}
  .foot{display:flex;justify-content:space-between;align-items:baseline;
        margin-top:44px;font-family:var(--font-display);font-weight:700;
        font-size:38px;color:var(--milk);}
  .count{font-size:32px;letter-spacing:0.08em;
         color:rgba(248,245,241,0.6);}
</style></head><body>
<div class="slide">
  <img src="../design/assets/images/cover-red.jpg"
       style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;">
  <div style="position:absolute;inset:0;background:linear-gradient(180deg,
       rgba(31,31,31,0.45) 0%,rgba(31,31,31,0.08) 24%,
       rgba(31,31,31,0.24) 46%,rgba(31,31,31,0.78) 70%,
       rgba(31,31,31,0.95) 100%);"></div>
  <div class="pill">Кейс</div>
  <div class="mark">lily_.space</div>
  <div class="well">
    <div class="head">ChatGPT утопил клиента<br>в документации</div>
    <div class="sub">Он просил собрать чат-бот по профориентации.
      <span class="hl">Два дня</span> работы,
      <span class="hl">ноль результата</span>.</div>
    <div class="foot"><span>Листай дальше →</span>
      <span class="count">01 / 06</span></div>
  </div>
</div></body></html>
