<!-- @dsCard group="Slides" viewport="1080x1350" name="Carousel · Cover" subtitle="Photo hook — card 1 of 6"
     Эталон, а не шаблон: на этом пути разметку пишет модель, клонируя
     файл и меняя содержимое. Пути здесь те, по которым макет ляжет в
     `{бренд}/posts/` — оттуда до токенов и фотобанка один уровень вверх.

     Снято с референсной карусели (`design/assets/reference/ig/`).
     Система там обратная той, что была у нас до 05.09: не молочный текст
     по затемнённому кадру, а **графитовый по светлому**. Вместо вуали
     поверх фото — молочная растушёвка со стороны текста; она осветляет
     кадр, а не гасит его, и лицо остаётся открытым.

     Счётчика карточки в подвале нет: Instagram рисует свой («1/6») в том
     же углу, и второй счётчик читался бы ошибкой вёрстки. Ника и пилюли
     рубрики в референсе тоже нет — подпись под каруселью делает эту
     работу.

     `object-position` подбирается под кадр, а не копируется: лицо
     должно стоять в открытой половине, за пределами растушёвки. Здесь
     это `88% 40%` — на `72%` заголовок ложился прямо на лицо. -->
<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../design/tokens.css"><style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:var(--font-body);}
  .slide{width:1080px;height:1350px;position:relative;overflow:hidden;
         background:var(--milk);}
  img{display:block;}
  /* Растушёвка со стороны текста. Она не «затемнение наоборот»: кадр
     остаётся собой, светлеет только полоса под словами. Хвост
     обязательно доходит до нуля — жёсткая граница читается плашкой. */
  .wash{position:absolute;inset:0;background:linear-gradient(102deg,
        rgba(248,245,241,0.95) 0%,rgba(248,245,241,0.90) 34%,
        rgba(248,245,241,0.62) 54%,rgba(248,245,241,0.16) 70%,
        rgba(248,245,241,0) 82%);}
  .well{position:absolute;left:84px;right:392px;top:300px;}
  .head{font-family:var(--font-display);font-weight:800;font-size:92px;
        line-height:1.05;letter-spacing:-0.035em;color:var(--text-primary);}
  /* Акцентное слово прямо в заголовке — главный приём системы. На
     светлом это `--text-accent` (неон-deep): чистый неон на молоке не
     читается. Одно-два слова на карточку, не больше. */
  .ac{color:var(--text-accent);}
  .rule{width:132px;height:5px;border-radius:3px;margin:44px 0 0;
        background:var(--accent-hover);}
  .sub{font-size:38px;line-height:1.5;color:var(--text-secondary);
       margin-top:34px;max-width:600px;}
  /* Плашка под ударной фразой: тинт, а не чистый акцент. Текст остаётся
     графитовым — на светлой плашке он и должен читаться текстом. */
  .hl{background:var(--accent-tint);border-radius:12px;padding:2px 14px;
      box-decoration-break:clone;-webkit-box-decoration-break:clone;}
</style></head><body>
<div class="slide">
  <img src="../design/assets/images/img-1984.jpg"
       style="position:absolute;inset:0;width:100%;height:100%;
              object-fit:cover;object-position:88% 40%;">
  <div class="wash"></div>
  <div class="well">
    <div class="head">Как <span class="ac">агент</span><br>будет вести<br>ваш канал<br>вместо вас</div>
    <div class="rule"></div>
    <div class="sub">Посмотрите, сколько работы он забирает
      <span class="hl">уже сейчас.</span></div>
  </div>
</div></body></html>
