<!-- @dsCard group="Slides" viewport="1080x1350" name="Carousel · Final + CTA" subtitle="Photo hook, text above — card 6 of 6"
     Финал. Панели здесь нет: текст ложится прямо на светлый кадр, как на
     обложке, — карусель закрывается тем же приёмом, каким открылась, и
     конец читается концом, а не ещё одним пунктом.

     Тёмной панели, которая стояла тут до 05.09, в референсе
     (`design/assets/reference/ig/`) нет вовсе: финал там самый светлый
     экран из шести. Инверсия в конце давала обрыв, а не вывод.

     Зов один. Плашка на нём одна — то самое слово, которое человек
     должен написать или нажать. Второй плашки на карточке нет: две
     подсветки перестают быть подсветкой. -->
<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../design/tokens.css"><style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:var(--font-body);}
  .slide{width:1080px;height:1350px;position:relative;overflow:hidden;
         background:var(--milk);}
  img{display:block;}
  /* Растушёвка сверху: слова стоят в верхней трети, кадр внизу открыт. */
  .wash{position:absolute;inset:0;background:linear-gradient(180deg,
        rgba(248,245,241,0.96) 0%,rgba(248,245,241,0.92) 30%,
        rgba(248,245,241,0.58) 48%,rgba(248,245,241,0.12) 64%,
        rgba(248,245,241,0) 76%);}
  .well{position:absolute;left:84px;right:96px;top:110px;}
  .head{font-family:var(--font-display);font-weight:800;font-size:82px;
        line-height:1.07;letter-spacing:-0.035em;color:var(--text-primary);}
  .ac{color:var(--text-accent);}
  .rule{width:132px;height:5px;border-radius:3px;margin:40px 0 0;
        background:var(--accent-hover);}
  .body{font-size:36px;line-height:1.5;color:var(--text-secondary);
        margin-top:34px;max-width:820px;}
  .hl{background:var(--accent-tint);border-radius:12px;padding:2px 14px;
      box-decoration-break:clone;-webkit-box-decoration-break:clone;
      font-weight:600;color:var(--text-primary);}
</style></head><body>
<div class="slide">
  <img src="../design/assets/images/img-0109.jpg"
       style="position:absolute;inset:0;width:100%;height:100%;
              object-fit:cover;object-position:50% 62%;">
  <div class="wash"></div>
  <div class="well">
    <div class="head">Хотите отдать<br>часть канала
      <span class="ac">роли</span>?</div>
    <div class="rule"></div>
    <div class="body">Напишите слово <span class="hl">ЗАВОД</span>
      — пришлю разбор, с чего начать и что настраивается за вечер.</div>
  </div>
</div></body></html>
