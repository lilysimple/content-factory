<!-- @dsCard group="Slides" viewport="1080x1350" name="Carousel · Point" subtitle="Arc panel left, photo right — cards 3 and 4 of 6"
     Паттерн пункта. В карусели их три — карточки 3, 4 и 5, — и они
     чередуют сторону: два раза этот файл, один раз зеркальный
     (`carousel-04-point-mirror`). Одна и та же сторона три раза подряд
     читается как один длинный экран, и человек уходит на середине.

     Край панели — дуга, а не прямая: вертикальные радиусы сложены в
     высоту карточки (675 + 675 = 1350), поэтому два угла сходятся в одну
     непрерывную кривую, без прямого куска посередине. Это подпись
     системы из референса (`design/assets/reference/ig/`), и ломать её
     клоном не надо: меняются слова и фото, кривая остаётся.

     Номера пункта в подвале больше нет. В референсе счёт ведут словами
     («Раньше…», «Теперь…») или самим порядком карточек, а двузначный
     `01` в углу тянул на себя внимание сильнее заголовка. -->
<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../design/tokens.css"><style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:var(--font-body);}
  .slide{width:1080px;height:1350px;position:relative;overflow:hidden;
         background:var(--milk);}
  img{display:block;}
  .panel{position:absolute;left:0;top:0;bottom:0;width:57%;
         background:var(--milk);
         border-radius:0 220px 220px 0/0 675px 675px 0;
         padding:150px 96px 120px 84px;}
  .head{font-family:var(--font-display);font-weight:800;font-size:76px;
        line-height:1.08;letter-spacing:-0.03em;color:var(--text-primary);}
  .ac{color:var(--text-accent);}
  .rule{width:132px;height:5px;border-radius:3px;margin:40px 0 0;
        background:var(--accent-hover);}
  .body{font-size:36px;line-height:1.5;color:var(--text-secondary);
        margin-top:34px;}
  .body + .body{margin-top:32px;}
  .num{color:var(--text-accent);font-weight:600;}
  .hl{background:var(--accent-tint);border-radius:12px;padding:2px 12px;
      box-decoration-break:clone;-webkit-box-decoration-break:clone;}
</style></head><body>
<div class="slide">
  <img src="../design/assets/images/img-0976.jpg"
       style="position:absolute;inset:0;width:100%;height:100%;
              object-fit:cover;object-position:78% 45%;">
  <div class="panel">
    <div class="head">Одна <span class="ac">роль</span><br>уже забирает<br>работу целой<br>команды</div>
    <div class="rule"></div>
    <div class="body">Она собирает план недели, пишет посты,
      верстает макеты и готовит их к публикации.</div>
    <div class="body">Раньше на это уходил
      <span class="hl">целый вечер</span> и три круга правок.</div>
  </div>
</div></body></html>
