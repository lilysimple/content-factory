<!-- @dsTemplate viewport="1080x1350" name="Telegram · раздача"
     Слоты заполняет код, а не модель; набор — SLOTS в
     orchestrator/design.py. Фото здесь нет намеренно: раздают вещь, а
     не показывают автора, и светлый холст читается в ленте иначе, чем
     тёмная обложка поста. Слот `photo` до этого шаблона не доезжает.

     Система та же, что у поста, но перевёрнутая по свету: на молоке
     акцентом текста работает `--text-accent` (тёмный оттенок), а чистый
     `--accent` остаётся заливкой плашек — светлый неон на светлом фоне
     не читается. -->
<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../design/tokens.css"><style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:var(--font-body);}
  .slide{width:1080px;height:1350px;position:relative;overflow:hidden;
         background:var(--milk);}
  .pill{position:absolute;left:84px;top:84px;padding:20px 40px;
        border-radius:var(--radius-pill);background:var(--accent);
        font-family:var(--font-display);font-size:30px;font-weight:700;
        letter-spacing:0.08em;text-transform:uppercase;
        color:var(--accent-ink);}
  .mark{position:absolute;right:84px;top:84px;height:70px;
        display:flex;align-items:center;font-family:var(--font-body);
        font-size:30px;font-weight:500;color:var(--text-secondary);}
  /* Блок текста в оптическом центре, а не под плашкой: на светлом
     холсте без фото пустая нижняя треть читается как незавёрстанная. */
  .well{position:absolute;left:84px;right:84px;top:50%;
        transform:translateY(-56%);}
  .head{--accent-headline:var(--text-accent);font-family:var(--font-display);font-weight:800;line-height:1.04;
        letter-spacing:-0.03em;color:var(--text-primary);
        font-size:{{headline_size}}px;}
  .rule{width:96px;height:6px;border-radius:3px;background:var(--accent);
        margin-top:40px;}
  .sub{font-family:var(--font-body);font-size:40px;line-height:1.5;
       color:var(--text-secondary);margin-top:28px;max-width:840px;}
  .band{position:absolute;left:84px;right:84px;bottom:84px;
        background:var(--accent);border-radius:38px;padding:46px 54px;}
  .band-value{font-family:var(--font-display);font-weight:800;font-size:52px;
              color:var(--accent-ink);text-align:center;}
</style></head><body>
<div class="slide">
  <div class="pill">{{rubric}}</div>
  <div class="mark">{{handle}}</div>
  <div class="well">
    <div class="head">{{headline}}<span
         style="color:var(--text-accent);">{{headline_accent}}</span></div>
    <div class="rule"></div>
    <div class="sub">{{subtitle}}</div>
  </div>
  <!-- Подписи «Раздача» здесь нет: это же слово стоит в плашке-рубрике
       сверху, и второй раз оно работает шумом, а не смыслом. -->
  <div class="band">
    <div class="band-value">Условия в посте ↓</div>
  </div>
</div></body></html>
