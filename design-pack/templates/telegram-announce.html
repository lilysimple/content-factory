<!-- @dsTemplate viewport="1080x1350" name="Telegram · анонс"
     Слоты заполняет код, а не модель. Каждый {{слот}} описан в SLOTS
     (orchestrator/design.py): что это, сколько знаков, обязателен ли.

     Одна система с постом (эталон бренда, design/assets/reference/tg):
     плашка-рубрика акцентом, подпись бренда справа, хук с акцентным
     словом, черта, подзаголовок. Отличие анонса — подзаголовок несёт
     «когда и где», и потому идёт в две-три строки: перевод строки в
     значении становится переносом на макете.

     Цвета — только семантические токены (`--accent`, а не `--neon`):
     шаблон общий для всех тенантов, конкретный цвет живёт у бренда. -->
<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../design/tokens.css"><style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:var(--font-body);}
  .slide{width:1080px;height:1350px;position:relative;overflow:hidden;
         background:var(--graphite);}
  img{display:block;}
  .pill{position:absolute;left:72px;top:66px;padding:20px 40px;
        border-radius:var(--radius-pill);background:var(--accent);
        font-family:var(--font-display);font-size:30px;font-weight:700;
        letter-spacing:0.08em;text-transform:uppercase;
        color:var(--accent-ink);}
  .mark{position:absolute;right:72px;top:66px;height:70px;
        display:flex;align-items:center;font-family:var(--font-body);
        font-size:30px;font-weight:500;color:rgba(248,245,241,0.72);}
  .well{position:absolute;left:72px;right:72px;bottom:72px;}
  .head{--accent-headline:var(--accent);font-family:var(--font-display);font-weight:800;line-height:1.02;
        letter-spacing:-0.03em;color:var(--milk);font-size:{{headline_size}}px;}
  .rule{width:96px;height:6px;border-radius:3px;background:var(--accent);
        margin-top:40px;}
  .sub{font-family:var(--font-body);font-size:38px;line-height:1.5;
       font-weight:400;color:rgba(248,245,241,0.82);margin-top:28px;
       max-width:820px;}
</style></head><body>
<div class="slide">
  <img src="../design/assets/images/{{photo}}"
       style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;">
  <div style="position:absolute;inset:0;background:linear-gradient(180deg,
       rgba(31,31,31,0.45) 0%,rgba(31,31,31,0.08) 24%,
       rgba(31,31,31,0.24) 46%,rgba(31,31,31,0.78) 72%,
       rgba(31,31,31,0.95) 100%);"></div>
  <div class="pill">{{rubric}}</div>
  <div class="mark">{{handle}}</div>
  <div class="well">
    <div class="head">{{headline}}<span
         style="color:var(--accent);">{{headline_accent}}</span></div>
    <div class="rule"></div>
    <div class="sub">{{subtitle}}</div>
  </div>
</div></body></html>
