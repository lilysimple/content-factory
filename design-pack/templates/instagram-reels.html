<!-- @dsTemplate viewport="1080x1920" name="Instagram · reels"
     Обложка рилса, которую верстает Дизайнер. Не путать с обложкой,
     которую собирает монтаж из кадра дубля (`montage`, ТЗ
     `design/platforms/instagram-reels-cover.md`): эта нужна, когда
     дубля нет или кадр из него не годится.

     Кегль хука идёт от `_fit` и умножается в CSS: холст выше, места
     под текст больше, а арифметика остаётся в одном месте. -->
<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../design/tokens.css"><style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:var(--font-body);}
  .slide{width:1080px;height:1920px;position:relative;overflow:hidden;
         background:var(--graphite);}
  img{display:block;}
  .pill{position:absolute;left:80px;top:250px;padding:18px 38px;
        border-radius:100px;background:rgba(255,255,255,0.18);
        backdrop-filter:blur(6px);font-family:var(--font-display);
        font-size:32px;font-weight:700;letter-spacing:0.08em;
        text-transform:uppercase;color:#fff;}
  .well{position:absolute;left:80px;right:80px;bottom:320px;}
  .head{--accent-headline:var(--accent-on-dark);font-family:var(--font-display);font-weight:800;line-height:1.04;
        letter-spacing:-0.025em;color:var(--milk);
        font-size:calc({{headline_size}}px * 1.18);}
  .sub{font-family:var(--font-body);font-size:46px;line-height:1.4;
       color:rgba(248,245,241,0.85);margin-top:40px;max-width:860px;}
</style></head><body>
<div class="slide">
  <img src="../design/assets/images/{{photo}}"
       style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;">
  <div style="position:absolute;inset:0;background:linear-gradient(180deg,
       rgba(31,31,31,0.45) 0%,rgba(31,31,31,0.08) 32%,
       rgba(31,31,31,0.86) 100%);"></div>
  <div class="pill">{{rubric}}</div>
  <div class="well">
    <div class="head">{{headline}}<span
         style="color:var(--accent-on-dark);">{{headline_accent}}</span></div>
    <div class="sub">{{subtitle}}</div>
  </div>
</div></body></html>
