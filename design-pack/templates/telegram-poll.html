<!-- @dsTemplate viewport="1080x1350" name="Telegram · опрос"
     Слоты заполняет код, а не модель; набор — SLOTS в
     orchestrator/design.py. Фото нет: опрос это вопрос, и лицо автора
     тянет внимание на себя. Хук здесь — сам вопрос, подзаголовок —
     зачем на него отвечать.

     Система поста на светлом холсте: плашка-рубрика, подпись бренда,
     хук, черта, подзаголовок. Знак вопроса — заливка `--accent-tint`,
     самый тихий оттенок акцента: это фактура, а не второй акцент. -->
<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../design/tokens.css"><style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:var(--font-body);}
  .slide{width:1080px;height:1350px;position:relative;overflow:hidden;
         background:var(--milk-deep);}
  /* Ниже подписи бренда: на прежней высоте знак лез под неё,
     и подпись читалась поверх фактуры. */
  .glyph{position:absolute;right:-40px;top:150px;
         font-family:var(--font-display);font-weight:800;font-size:620px;
         line-height:1;color:var(--accent-tint);}
  .pill{position:absolute;left:84px;top:84px;padding:20px 40px;
        border-radius:var(--radius-pill);background:var(--accent);
        font-family:var(--font-display);font-size:30px;font-weight:700;
        letter-spacing:0.08em;text-transform:uppercase;
        color:var(--accent-ink);}
  .mark{position:absolute;right:84px;top:84px;height:70px;
        display:flex;align-items:center;font-family:var(--font-body);
        font-size:30px;font-weight:500;color:var(--text-secondary);}
  .well{position:absolute;left:84px;right:84px;top:50%;
        transform:translateY(-56%);}
  .head{--accent-headline:var(--text-accent);font-family:var(--font-display);font-weight:800;line-height:1.06;
        letter-spacing:-0.03em;color:var(--text-primary);
        font-size:{{headline_size}}px;}
  .rule{width:96px;height:6px;border-radius:3px;background:var(--accent);
        margin-top:40px;}
  .sub{font-family:var(--font-body);font-size:40px;line-height:1.5;
       color:var(--text-secondary);margin-top:28px;max-width:820px;}
  .hint{position:absolute;left:84px;bottom:84px;display:flex;
        align-items:center;gap:24px;}
  .dot{width:26px;height:26px;border-radius:50%;background:var(--accent);}
  .dot-2{width:26px;height:26px;border-radius:50%;
         background:var(--accent-hover);}
  .hint-text{font-family:var(--font-display);font-size:36px;font-weight:600;
             color:var(--text-secondary);}
</style></head><body>
<div class="slide">
  <div class="glyph">?</div>
  <div class="pill">{{rubric}}</div>
  <div class="mark">{{handle}}</div>
  <div class="well">
    <div class="head">{{headline}}<span
         style="color:var(--text-accent);">{{headline_accent}}</span></div>
    <div class="rule"></div>
    <div class="sub">{{subtitle}}</div>
  </div>
  <div class="hint">
    <div class="dot"></div><div class="dot-2"></div>
    <span class="hint-text">Ответ — в опросе под постом</span>
  </div>
</div></body></html>
