<!-- @dsTemplate viewport="1080x1920" name="Instagram · сторис"
     Слоты заполняет код, а не модель; набор — SLOTS в
     orchestrator/design.py.

     Безопасные поля жёсткие: сверху 250px под ник и аватар, снизу
     360px под строку ответа и стрелку «ещё». Всё, что туда попадёт,
     закроет интерфейс Instagram, и увидит это уже человек в сторис. -->
<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../design/tokens.css"><style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:var(--font-body);}
  .slide{width:1080px;height:1920px;position:relative;overflow:hidden;
         background:var(--graphite);}
  img{display:block;}
  .eyebrow{position:absolute;left:80px;top:250px;
           font-family:var(--font-display);font-size:32px;font-weight:700;
           letter-spacing:0.1em;text-transform:uppercase;
           color:var(--accent-on-dark);}
  .well{position:absolute;left:80px;right:80px;bottom:360px;}
  .head{--accent-headline:var(--accent-on-dark);font-family:var(--font-display);font-weight:800;line-height:1.05;
        letter-spacing:-0.025em;color:var(--milk);
        font-size:calc({{headline_size}}px * 1.12);}
  .sub{font-family:var(--font-body);font-size:44px;line-height:1.45;
       color:rgba(248,245,241,0.82);margin-top:40px;max-width:840px;}
  .swipe{position:absolute;left:80px;bottom:250px;
         font-family:var(--font-display);font-size:36px;font-weight:600;
         color:rgba(248,245,241,0.6);}
</style></head><body>
<div class="slide">
  <img src="../design/assets/images/{{photo}}"
       style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;">
  <div style="position:absolute;inset:0;background:linear-gradient(180deg,
       rgba(31,31,31,0.55) 0%,rgba(31,31,31,0.12) 30%,
       rgba(31,31,31,0.88) 100%);"></div>
  <div class="eyebrow">{{rubric}}</div>
  <div class="well">
    <div class="head">{{headline}}<span
         style="color:var(--accent-on-dark);">{{headline_accent}}</span></div>
    <div class="sub">{{subtitle}}</div>
  </div>
  <div class="swipe">Листай дальше →</div>
</div></body></html>
